<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Wedding Venues</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="top">
    <h1>Wedding venues</h1>
    <div class="who">
      <span id="whoLabel"></span>
      <button id="switchWho" class="link">switch</button>
      <span id="sync" class="sync" title="Sync status">...</span>
    </div>
  </div>
  <nav id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="Boston">Boston</button>
    <button data-f="NYC">NYC</button>
    <button data-f="both">Both love</button>
    <button data-f="todo">I haven't voted</button>
    <button data-f="compare">Compare</button>
  </nav>
</header>

<main id="list"></main>
<main id="compare" class="hide"></main>

<div id="who-modal" class="modal hide">
  <div class="box">
    <h2>Who are you?</h2>
    <p>Your votes are saved under this name.</p>
    <button data-who="Young">Young</button>
    <button data-who="Nanami">Nanami</button>
  </div>
</div>

<div id="lb" class="hide">
  <button id="lbPrev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" alt="">
  <button id="lbNext" aria-label="Next">&#8250;</button>
  <button id="lbClose" aria-label="Close">&times;</button>
</div>

<footer>Estimates are rough planning numbers, not quotes. Photos are from venue websites and Here Comes The Guide, for personal use only.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
